plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.atlas.nativeapp'
    compileSdk 36
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.atlas.nativeapp'
        minSdk 26
        targetSdk 36
        versionCode (project.findProperty('atlasVersionCode') ?: '2').toString().toInteger()
        versionName (project.findProperty('atlasVersionName') ?: '0.2.0-native').toString()
        externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DANDROID_STL=c++_shared' } }
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    externalNativeBuild { cmake { path '../../native/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    // Debug CI keeps testing the debug variant; release CI opts in explicitly.
    testBuildType (project.findProperty('atlasTestBuildType') ?: 'debug').toString()
    // Only the CI/user-supplied keystore is accepted; no ephemeral key generation.
    // An assembleRelease without these variables fails instead of silently
    // distributing an unsigned release (debug builds remain unchanged).
    def releaseEnvNames = [
        'ATLAS_ANDROID_KEYSTORE_PATH', 'ATLAS_ANDROID_KEYSTORE_PASSWORD',
        'ATLAS_ANDROID_KEY_PASSWORD', 'ATLAS_ANDROID_KEY_ALIAS'
    ]
    def releaseSigningProvided = releaseEnvNames.every { name ->
        def value = System.getenv(name)
        value != null && !value.trim().isEmpty()
    }
    signingConfigs {
        if (releaseSigningProvided) {
            release {
                storeFile file(System.getenv('ATLAS_ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ATLAS_ANDROID_KEYSTORE_PASSWORD')
                keyPassword System.getenv('ATLAS_ANDROID_KEY_PASSWORD')
                keyAlias System.getenv('ATLAS_ANDROID_KEY_ALIAS')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningProvided) signingConfig signingConfigs.release
        }
    }
    // Fail closed for release tasks, including assembleReleaseAndroidTest.
    gradle.taskGraph.whenReady { graph ->
        if (graph.allTasks.any { it.project == project &&
                (it.name == 'assembleRelease' ||
                 it.name == 'bundleRelease' ||
                 it.name == 'packageRelease' ||
                 it.name == 'assembleReleaseAndroidTest') } && !releaseSigningProvided) {
            throw new GradleException('Missing ATLAS_ANDROID_* signing environment variables; refusing unsigned Release')
        }
    }
}
dependencies {
    implementation 'androidx.activity:activity-ktx:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'androidx.work:work-runtime-ktx:2.10.5'
    // 11.8.4 includes the Android emulator rendering fix (maplibre issue #3308).
    // Keep >=11.7.0 for built-in pmtiles://file:// source support.
    implementation 'org.maplibre.gl:android-sdk:11.8.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
