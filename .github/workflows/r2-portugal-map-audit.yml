name: Cloudflare R2 Portugal map audit

on:
  workflow_dispatch:
  push:
    branches: ['migration/native-core-kotlin', 'audit/offline-eiras-street']
    paths:
      - '.github/workflows/r2-portugal-map-audit.yml'

permissions:
  contents: read

jobs:
  public-r2-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe published R2 object keys (read-only)
        shell: bash
        env:
          ORIGIN: https://pub-75539028275a4826aa383fdb89292ed7.r2.dev
        run: |
          set -euo pipefail
          echo '## Cloudflare R2 public-object audit' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'This probes known public paths only; it cannot enumerate private bucket objects.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '| Key | HTTP | Content length | Content type |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | ---: | ---: | --- |' >> "$GITHUB_STEP_SUMMARY"

          keys=(
            'regions/catalog.json'
            'region-packages/portugal/routing/manifest.json'
            'region-packages/portugal/poi-index.json'
            'regions/london/map.pmtiles'
            'regions/portugal/map.pmtiles'
            'region-packages/portugal/map.pmtiles'
            'regions/portugal/mainland/map.pmtiles'
            'region-packages/portugal/mainland/map.pmtiles'
          )
          for key in "${keys[@]}"; do
            echo "::group::Checking $key"
            headers="$(mktemp)"
            status="$(curl --location --silent --show-error --head \
              --retry 2 --retry-delay 1 --connect-timeout 12 --max-time 35 \
              --output "$headers" --write-out '%{http_code}' \
              "$ORIGIN/$key")" || status='connection-failed'
            length="$(grep -i '^content-length:' "$headers" | tail -1 | tr -d '\r' | cut -d: -f2- | xargs || true)"
            type="$(grep -i '^content-type:' "$headers" | tail -1 | tr -d '\r' | cut -d: -f2- | xargs || true)"
            echo "$key => HTTP $status size=${length:-unknown} type=${type:-unknown}"
            printf '| `%s` | %s | %s | %s |\n' "$key" "$status" "${length:-—}" "${type:-—}" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$status" == "200" && "$key" == *.pmtiles ]]; then
              echo 'A PMTiles candidate responds successfully at this public URL.'
              magic="$(curl --location --silent --show-error \
                --range 0-6 --max-filesize 64 --connect-timeout 12 --max-time 25 \
                "$ORIGIN/$key" 2>/dev/null || true)"
              if [[ "$magic" == PMTiles* ]]; then echo 'Header magic: PMTiles (valid archive signature)'
              else echo 'Header magic unverified (server may not honor range or returned non-PMTiles bytes)'; fi
            fi
            rm -f "$headers"
            echo '::endgroup::'
          done

  published-address-audit:
    if: ${{ github.ref == 'refs/heads/audit/offline-eiras-street' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Read exact published R2 binary search assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/atlas-r2-eiras
          origin="https://pub-75539028275a4826aa383fdb89292ed7.r2.dev/region-packages/portugal"
          for object in address-index.bin address-records.bin search-index.bin search-records.bin; do
            echo "::group::Download $object"
            curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 15 \
              --max-time 210 --silent --show-error \
              "$origin/$object" --output "/tmp/atlas-r2-eiras/$object"
            stat -c '%n size=%s' "/tmp/atlas-r2-eiras/$object"
            sha256sum "/tmp/atlas-r2-eiras/$object"
            echo '::endgroup::'
          done
      - name: Run real native Atlas search for street in Coimbra
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native -B /tmp/atlas-eiras-build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/atlas-eiras-build --target atlas_search --parallel 2
          python3 - <<'PY'
          import json, pathlib, subprocess
          root=pathlib.Path('/tmp/atlas-r2-eiras')
          expected='Rua Professor Albuquerque de Matos'
          normalized=expected.casefold()
          print('Target:',expected)
          all_results={}
          for dataset,mode in [('address','address'),('poi',None)]:
              cmd=['/tmp/atlas-eiras-build/atlas_search',str(root),expected,
                   '40.24887','-8.41170']
              if mode: cmd.append(mode)
              res=subprocess.run(cmd,check=True,text=True,capture_output=True)
              items=json.loads(res.stdout)
              all_results[dataset]=items
              print(dataset,'exact query results:',len(items))
              for item in items[:10]:
                  print('  ',item.get('name'),item.get('address'),item.get('distanceMeters'))
              data=(root/('address-records.bin' if dataset=='address' else 'search-records.bin')).read_bytes()
              print(dataset,'record byte-string name occurs:',normalized.encode() in data.lower())
          matched=[]
          for dataset,items in all_results.items():
              for item in items:
                  name=item.get('name','')
                  addr=item.get('address','')
                  if normalized in (name+' '+addr).casefold():
                      matched.append((dataset,name))
          if matched:
              conclusion='FOUND IN PUBLISHED OFFLINE ATLAS SEARCH PACKAGE'
              print('AUDIT:',conclusion,matched)
          else:
              conclusion='MISSING FROM PUBLISHED OFFLINE ATLAS SEARCH QUERY'
              print('AUDIT:',conclusion)
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(f'## Offline Atlas Coimbra street audit\n\n')
              f.write(f'**Street:** {expected}, Eiras, Coimbra, 3020-119\n\n')
              f.write(f'**Result:** {conclusion}\n\n')
              f.write(f'**Address search count:** {len(all_results["address"])}; ')
              f.write(f'**POI search count:** {len(all_results["poi"])}\n')
          PY
