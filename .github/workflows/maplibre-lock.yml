name: Generate MapLibre lockfile

on:
  push:
    branches:
      - feature/maplibre-renderer

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[maplibre-lock]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/maplibre-renderer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Add MapLibre dependency and refresh lockfile
        run: npm install maplibre-gl@6.6.0 --save --package-lock-only
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Add MapLibre GL dependency [maplibre-lock]"
          git push origin HEAD:feature/maplibre-renderer
