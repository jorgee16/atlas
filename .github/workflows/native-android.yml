                --target "$VALIDATED_SHA" --title "Atlas v$RELEASE_VERSION" \
                --notes "Signed Release (versionCode $RELEASE_CODE) from validated commit $VALIDATED_SHA, CI run #254. Native and Android emulator tests previously passed; no tests rerun. Persistent certificate, signature and version upgrade compatibility verified." \
                --prerelease; then
