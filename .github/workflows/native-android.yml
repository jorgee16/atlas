      - name: Install Android release toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Require a stable signing identity and valid release version
        shell: bash
        run: |
          set -euo pipefail
          # When native-android.yml is not on the default branch, GitHub may
          # not expose its workflow_dispatch UI. An explicit commit marker
          # triggers the same gated release process using this tracked version.
          RELEASE_VERSION="${RELEASE_VERSION:-$(python3 -c 'import json; print(json.load(open("tools/atlas-release-version.json"))["versionName"])')}"
          RELEASE_CODE="${RELEASE_CODE:-$(python3 -c 'import json; print(json.load(open("tools/atlas-release-version.json"))["versionCode"])')}"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_CODE=$RELEASE_CODE" >> "$GITHUB_ENV"
          for key in ATLAS_ANDROID_KEYSTORE_BASE64 ATLAS_ANDROID_KEYSTORE_PASSWORD ATLAS_ANDROID_KEY_PASSWORD ATLAS_ANDROID_KEY_ALIAS ATLAS_ANDROID_CERT_SHA256; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing ${key}; signed release publication is blocked."
              exit 1
            fi
          done
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Release version must be X.Y.Z"; exit 1; }
          [[ "$RELEASE_CODE" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Release code must be a positive integer"; exit 1; }
          [[ "${#ATLAS_ANDROID_CERT_SHA256}" -ge 64 ]] || { echo "::error::Expected certificate SHA-256 is invalid"; exit 1; }
          keyfile="$RUNNER_TEMP/atlas-release-signing.jks"
          ( umask 077; printf '%s' "$ATLAS_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keyfile" )
          test -s "$keyfile" || { echo "::error::Invalid keystore data"; exit 1; }
          echo "ATLAS_ANDROID_KEYSTORE_PATH=$keyfile" >> "$GITHUB_ENV"
          # Only a public certificate digest is handled here, never the private key.
          keytool -exportcert -keystore "$keyfile" -storepass:env ATLAS_ANDROID_KEYSTORE_PASSWORD -alias "$ATLAS_ANDROID_KEY_ALIAS" \
            | sha256sum | cut -d' ' -f1 > "$RUNNER_TEMP/atlas-certificate.sha256"
