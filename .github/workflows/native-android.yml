      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Atlas-toll-graph-coverage
          path: toll-audit/
          if-no-files-found: error

  toll-catalog-publish:
    # Separate data publication: no APK/Release, graph replacement or new keys.
    needs: [core, android, toll-coverage, toll-section-input-audit, national-toll-source-audit]
    if: ${{ always() && !cancelled() && github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-tolls]') && github.ref == 'refs/heads/migration/native-core-kotlin' && needs.core.result == 'success' && needs.android.result == 'success' && needs.toll-coverage.result == 'success' && (needs.toll-section-input-audit.result == 'success' || needs.toll-section-input-audit.result == 'skipped') && (needs.national-toll-source-audit.result == 'success' || needs.national-toll-source-audit.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
