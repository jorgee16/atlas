name: Native C++ and Kotlin Android
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
    inputs:
      full_gps_replay:
        description: 'Release validation: complete Portugal GPS trip and videos'
        type: boolean
        default: false
      publish_release:
        description: 'Publish a signed, validated GitHub Release (requires stable signing secrets)'
        type: boolean
        default: false
      release_version:
        description: 'SemVer X.Y.Z (must exceed the previous Release version)'
        type: string
        default: '0.2.0'
      release_code:
        description: 'Android versionCode (must exceed previous released code)'
        type: string
        default: '3'
  push:
    branches: ['migration/native-core-kotlin']
  pull_request:
    paths: ['native/**', 'android/native-app/**', 'android/build.gradle', 'android/settings.gradle', '.github/workflows/native-android.yml']
permissions:
  contents: read
jobs:
  release-identity:
    # Fail early on a missing/mismatched existing key while navigation tests run.
    # Never generates a keystore and never changes the pinned identity.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_release == true || github.event_name == 'push' && contains(github.event.head_commit.message, '[atlas-release]')) && github.ref == 'refs/heads/migration/native-core-kotlin' }}
    runs-on: ubuntu-latest
    env:
      ATLAS_ANDROID_KEYSTORE_BASE64: ${{ secrets.ATLAS_ANDROID_KEYSTORE_BASE64 }}
      ATLAS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ATLAS_ANDROID_KEYSTORE_PASSWORD }}
      ATLAS_ANDROID_KEY_PASSWORD: ${{ secrets.ATLAS_ANDROID_KEY_PASSWORD }}
      ATLAS_ANDROID_KEY_ALIAS: ${{ secrets.ATLAS_ANDROID_KEY_ALIAS }}
      ATLAS_ANDROID_CERT_SHA256: ${{ vars.ATLAS_ANDROID_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify existing signing identity without publishing
        shell: bash
        run: |
          set -euo pipefail
          for key in ATLAS_ANDROID_KEYSTORE_BASE64 ATLAS_ANDROID_KEYSTORE_PASSWORD ATLAS_ANDROID_KEY_PASSWORD ATLAS_ANDROID_KEY_ALIAS ATLAS_ANDROID_CERT_SHA256; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing ${key}; signed Release is blocked."
              exit 1
            fi
          done
          keyfile="$RUNNER_TEMP/atlas-signing-preflight.jks"
          trap 'rm -f "$keyfile"' EXIT
          ( umask 077; printf '%s' "$ATLAS_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keyfile" )
          keytool -exportcert -keystore "$keyfile" -storepass:env ATLAS_ANDROID_KEYSTORE_PASSWORD -alias "$ATLAS_ANDROID_KEY_ALIAS" \
            | sha256sum | cut -d' ' -f1 > "$RUNNER_TEMP/atlas-preflight-certificate.sha256"
          python3 tools/atlas_android_release.py check-cert --certificate-file "$RUNNER_TEMP/atlas-preflight-certificate.sha256"
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install existing Atlas dependencies for parity fixtures
        run: npm ci --ignore-scripts
      - name: Generate fixtures with the existing Atlas packager
        run: node native/tests/generate-fixtures.mjs /tmp/atlas-native-fixtures
      - name: Generate search expectations from the original app
        run: node native/tests/generate-search-fixtures.mjs /tmp/atlas-search-parity
      - name: Build native C++ core
        run: cmake -S native -B /tmp/atlas-build -DCMAKE_BUILD_TYPE=Debug && cmake --build /tmp/atlas-build -j2
      - name: Native tests
        run: ctest --test-dir /tmp/atlas-build --output-on-failure
      - name: Compare with JavaScript routing
        run: python3 native/tests/compare-routes.py /tmp/atlas-native-fixtures /tmp/atlas-build/atlas_route
      - name: Compare with original POI and address search
        run: python3 native/tests/compare-search.py /tmp/atlas-search-parity /tmp/atlas-build/atlas_search
      - name: Test signed Release certificate and update guards (offline)
        run: python3 -m unittest discover -s tools -p 'test_atlas_android_release.py'
  android:
    # Fast, high-signal gate: ordinary Android instrumentation and the focused
    # GPS/camera smoke. Full-trip replay runs concurrently in its own job on
    # explicit validation/release requests; it must never serialize this gate.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install native Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate transit expectations from the original app
        run: |
          npm ci --ignore-scripts
          node tools/generate-native-transit-fixtures.mjs
      - name: Build Kotlin and JNI APK
        working-directory: android
        run: bash gradlew -PnativeOnly :native-app:assembleDebug :native-app:testDebugUnitTest :native-app:lintDebug :native-app:assembleDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-native-debug-apk
          path: android/native-app/build/outputs/apk/debug/native-app-debug.apk
          if-no-files-found: error
      - name: Install video tools for visual evidence review
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            # ffmpeg needs only Ubuntu. An unrelated Microsoft apt feed can
            # reject CI IPs and must not block Android emulator validation.
            sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 update -qq
            sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Download and verify real Portugal routing and offline map for GPS replay
        env:
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
        run: python3 tools/prepare-native-gps-replay.py
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android UI and focused GPS/camera smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          # Keep the same proven MapLibre headless software GPU backend.
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            bash tools/native-android-smoke.sh
            bash tools/native-android-gps-replay.sh camera
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Atlas-native-ui-review
          path: |
            ui-preview/
            android/native-app/build/reports/androidTests/
            android/native-app/build/reports/tests/
            android/native-app/build/reports/lint-results-debug.*
            android/native-app/build/outputs/androidTest-results/
          if-no-files-found: warn

  android-full-replay:
    # Execute the long, real-Portugal GPS trip IN PARALLEL with Android smoke,
    # only when explicitly requested. Signed releases still require its result.
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.publish_release == true || inputs.full_gps_replay == true)) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[full-gps-replay]') || contains(github.event.head_commit.message, '[atlas-release]'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install native Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Build GPS replay APK and instrumentation package
        working-directory: android
        run: bash gradlew -PnativeOnly :native-app:assembleDebug :native-app:assembleDebugAndroidTest --stacktrace
      - name: Install video tools for visual evidence review
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 update -qq
            sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Download and verify real Portugal routing and offline map
        env:
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
        run: python3 tools/prepare-native-gps-replay.py
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Complete Portugal Android GPS navigation replay
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash tools/native-android-gps-replay.sh full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Atlas-native-full-gps-review
          path: |
            ui-preview/
            android/native-app/build/reports/androidTests/
            android/native-app/build/outputs/androidTest-results/
          if-no-files-found: warn

  release:
    # Publishing is explicit. A normal push never tries to access signing secrets.
    # Signed Releases require core, focused Android smoke, and the full replay.
    needs: [core, android, android-full-replay, release-identity]
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_release == true || github.event_name == 'push' && contains(github.event.head_commit.message, '[atlas-release]')) && github.ref == 'refs/heads/migration/native-core-kotlin' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      ATLAS_ANDROID_KEYSTORE_BASE64: ${{ secrets.ATLAS_ANDROID_KEYSTORE_BASE64 }}
      ATLAS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ATLAS_ANDROID_KEYSTORE_PASSWORD }}
      ATLAS_ANDROID_KEY_PASSWORD: ${{ secrets.ATLAS_ANDROID_KEY_PASSWORD }}
      ATLAS_ANDROID_KEY_ALIAS: ${{ secrets.ATLAS_ANDROID_KEY_ALIAS }}
      ATLAS_ANDROID_CERT_SHA256: ${{ vars.ATLAS_ANDROID_CERT_SHA256 }}
      RELEASE_VERSION: ${{ inputs.release_version || '' }}
      RELEASE_CODE: ${{ inputs.release_code || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android release toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Require a stable signing identity and valid release version
        shell: bash
        run: |
          set -euo pipefail
          # When native-android.yml is not on the default branch, GitHub may
          # not expose its workflow_dispatch UI. An explicit commit marker
          # triggers the same gated release process using this tracked version.
          RELEASE_VERSION="${RELEASE_VERSION:-$(python3 -c 'import json; print(json.load(open("tools/atlas-release-version.json"))["versionName"])')}"
          RELEASE_CODE="${RELEASE_CODE:-$(python3 -c 'import json; print(json.load(open("tools/atlas-release-version.json"))["versionCode"])')}"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_CODE=$RELEASE_CODE" >> "$GITHUB_ENV"
          for key in ATLAS_ANDROID_KEYSTORE_BASE64 ATLAS_ANDROID_KEYSTORE_PASSWORD ATLAS_ANDROID_KEY_PASSWORD ATLAS_ANDROID_KEY_ALIAS ATLAS_ANDROID_CERT_SHA256; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing ${key}; signed release publication is blocked."
              exit 1
            fi
          done
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Release version must be X.Y.Z"; exit 1; }
          [[ "$RELEASE_CODE" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Release code must be a positive integer"; exit 1; }
          [[ "${#ATLAS_ANDROID_CERT_SHA256}" -ge 64 ]] || { echo "::error::Expected certificate SHA-256 is invalid"; exit 1; }
          keyfile="$RUNNER_TEMP/atlas-release-signing.jks"
          ( umask 077; printf '%s' "$ATLAS_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keyfile" )
          test -s "$keyfile" || { echo "::error::Invalid keystore data"; exit 1; }
          echo "ATLAS_ANDROID_KEYSTORE_PATH=$keyfile" >> "$GITHUB_ENV"
          # Only a public certificate digest is handled here, never the private key.
          keytool -exportcert -keystore "$keyfile" -storepass:env ATLAS_ANDROID_KEYSTORE_PASSWORD -alias "$ATLAS_ANDROID_KEY_ALIAS" \
            | sha256sum | cut -d' ' -f1 > "$RUNNER_TEMP/atlas-certificate.sha256"
          python3 tools/atlas_android_release.py check-cert --certificate-file "$RUNNER_TEMP/atlas-certificate.sha256"
      - name: Locate previous published APK (if any)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/android-previous
          tag="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select((.tag_name | startswith("atlas-android-v")) and (.draft | not))] | sort_by(.published_at) | last | .tag_name // ""')"
          if [[ -n "$tag" ]]; then
            [[ "$tag" != "atlas-android-v$RELEASE_VERSION" ]] || { echo "::error::This release version already exists"; exit 1; }
            gh release download "$tag" --dir dist/android-previous --pattern 'Atlas-v*.apk' --pattern release-manifest.json
            echo "ATLAS_PREVIOUS_TAG=$tag" >> "$GITHUB_ENV"
          else
            echo "No prior Atlas signed release; first installation may require uninstalling older debug builds."
          fi
          if gh release view "atlas-android-v$RELEASE_VERSION" >/dev/null 2>&1 ||
             git ls-remote --exit-code --tags origin "refs/tags/atlas-android-v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "::error::Refusing to replace an existing release/tag."
            exit 1
          fi
      - name: Build signed Release and Release instrumentation tests
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          bash gradlew -PnativeOnly -PatlasVersionCode="$RELEASE_CODE" -PatlasVersionName="$RELEASE_VERSION" -PatlasTestBuildType=release \
            :native-app:assembleRelease :native-app:testReleaseUnitTest :native-app:lintRelease :native-app:assembleReleaseAndroidTest \
            --no-daemon --console=plain
          mkdir -p ../dist/android-release-inputs
          cp native-app/build/outputs/apk/release/native-app-release.apk ../dist/android-release-inputs/release.apk
          cp native-app/build/outputs/apk/androidTest/release/native-app-release-androidTest.apk ../dist/android-release-inputs/instrumentation.apk
      - name: Create same-certificate future-update probe (not distributed)
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          next_code=$((RELEASE_CODE + 1))
          bash gradlew -PnativeOnly -PatlasVersionCode="$next_code" -PatlasVersionName="$RELEASE_VERSION-upgrade-probe" \
            :native-app:assembleRelease --no-daemon --console=plain
          cp native-app/build/outputs/apk/release/native-app-release.apk ../dist/android-release-inputs/upgrade-probe.apk
      - name: Check APK signature, certificate, package, versions and previous Release
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          previous=(dist/android-previous/Atlas-v*.apk)
          if (( ${#previous[@]} > 1 )); then echo "::error::Ambiguous previous release APKs"; exit 1; fi
          args=()
          if (( ${#previous[@]} == 1 )); then
            args+=(--previous-apk "${previous[0]}" --previous-manifest dist/android-previous/release-manifest.json)
          fi
          python3 tools/atlas_android_release.py package \
            --apk dist/android-release-inputs/release.apk \
            --probe dist/android-release-inputs/upgrade-probe.apk \
            --build-tools "$ANDROID_HOME/build-tools/36.0.0" \
            --version "$RELEASE_VERSION" --code "$RELEASE_CODE" --commit "$GITHUB_SHA" \
            --output dist/android-validated "${args[@]}"
      - name: Validate Release install and in-place upgrade on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash tools/atlas-android-release-upgrade.sh
      - name: Publish signed APK directly to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist/android-validated
          sha256sum --check "Atlas-v$RELEASE_VERSION.apk.sha256"
          tag="atlas-android-v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Refusing to overwrite existing release $tag"
            exit 1
          fi
          gh release create "$tag" "Atlas-v$RELEASE_VERSION.apk" "Atlas-v$RELEASE_VERSION.apk.sha256" release-manifest.json \
            --target "$GITHUB_SHA" --title "Atlas v$RELEASE_VERSION" \
            --notes "Signed Android Release (versionCode $RELEASE_CODE). Native C++ tests, Android navigation/GPS emulator tests, certificate and in-place-upgrade checks passed. Preserve this signing key for future updates." \
            --prerelease
          echo "APK: https://github.com/$GH_REPO/releases/download/$tag/Atlas-v$RELEASE_VERSION.apk" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: |
          if [[ -n "${ATLAS_ANDROID_KEYSTORE_PATH:-}" && -f "$ATLAS_ANDROID_KEYSTORE_PATH" ]]; then
            rm -f "$ATLAS_ANDROID_KEYSTORE_PATH"
          fi
      - name: Upload Release validation reports (no keys)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-native-release-validation
          if-no-files-found: ignore
          path: |
            dist/android-validated/release-manifest.json
            dist/android-validated/*.sha256
            dist/android-validated/upgrade-report.txt
            android/native-app/build/reports/lint-results-release.*

