  toll-section-input-audit:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[audit-toll-sections]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect hash-verified existing toll events and official open-system tariffs
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,urllib.request,subprocess,shutil
          from pathlib import Path
          root=Path('toll-section-audit');root.mkdir()
          catalog=json.loads(Path('android/native-app/src/main/assets/regions.json').read_text())
          region=next(r for r in catalog['regions'] if r['id']=='portugal')
          entry=next(e for e in region['package']['files'] if e['url'].endswith('/mainland/toll-events.json'))
          url='https://pub-75539028275a4826aa383fdb89292ed7.r2.dev'+entry['url']
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Atlas-Toll-Catalog/1.0'}),timeout=30) as response: data=response.read(2*1024*1024)
          assert len(data)==entry['sizeBytes'] and hashlib.sha256(data).hexdigest()==entry['sha256']
          (root/'toll-events.json').write_bytes(data)
          print('VERIFIED_TOLL_EVENTS='+json.dumps(json.loads(data),ensure_ascii=False))
          source='https://www.brisaconcessao.pt/Portals/0/Documentos/TabelaEcadaTaxas_23iva_01012026.pdf?ver=2025-12-30-185537-910'
          with urllib.request.urlopen(urllib.request.Request(source,headers={'User-Agent':'Atlas-Tariff-Audit/1.0'}),timeout=30) as response: pdf=response.read(8*1024*1024)
          assert pdf.startswith(b'%PDF') and len(pdf)<8*1024*1024
          (root/'brisa-2026.pdf').write_bytes(pdf)
          (root/'sources.json').write_text(json.dumps({'events':entry,'brisaSource':source,'brisaSha256':hashlib.sha256(pdf).hexdigest()},indent=2))
          print('VERIFIED_TOLL_SOURCES='+(root/'sources.json').read_text().replace('\n',''))
          if shutil.which('pdftotext'):
              subprocess.run(['pdftotext','-layout',str(root/'brisa-2026.pdf'),str(root/'brisa-2026.txt')],check=True)
              text=(root/'brisa-2026.txt').read_text()
              print('BRISA_OPEN_SYSTEM_PAGE='+text.split('\f')[-2])
          PYCODE

      - name: Inspect original OSM charge points and directed ways
        run: |
          python3 -m pip install 'osmium==4.1.1'
          python3 tools/audit-a5-charge-points.py
          python3 tools/build-toll-bindings.py --config tools/toll-binding-config/portugal-a5-mainline.json --source toll-section-audit/a5-osm-charge-points.json --output toll-section-audit/Portugal-mainland.csv
          cmake -S native -B /tmp/atlas-toll-proof -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/atlas-toll-proof --target atlas_toll_quote -j2
          python3 tools/verify-toll-route-proof.py --binary /tmp/atlas-toll-proof/atlas_toll_quote
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Atlas-toll-section-input-audit
          path: toll-section-audit/
          if-no-files-found: error

  recorded-a5-toll-review:
    # Inspect already validated Android evidence without another emulator run.
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[review-a5-tolls:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - id: source
        name: Require successful original Android validation
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import json,os,re,urllib.request
          match=re.search(r'\[review-a5-tolls:(\d+)\]',os.environ['MESSAGE'])
          if not match: raise ValueError('Missing original evidence run')
          run=match.group(1)
          request=urllib.request.Request(f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=30) as response: source=json.load(response)
          if source['conclusion']!='success' or source['head_branch']!='migration/native-core-kotlin': raise ValueError('Original Android run must have passed on the native branch')
          if source['head_sha']!='4c25da8e518eae957907a4affbd5057cefd57642': raise ValueError('Unexpected application source; review the original run first')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('run='+run+'\n')
          print('Original validated Android source:',source['head_sha'],source['html_url'])
          PYCODE
      - uses: actions/download-artifact@v4
        with:
          name: Atlas-native-ui-review
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run }}
          path: recorded-toll-review
      - name: Setup pinned video tools (no apt mirror)
        uses: ./.github/actions/setup-video-tools
      - id: review
        name: Validate original quotes and expose only the toll screenshot
        run: |
          python3 - <<'PYCODE'
          import os,subprocess
          from pathlib import Path
          matches=sorted(Path('recorded-toll-review').rglob('a5-preview-route.json'))
          preferred=[p for p in matches if p.parent.name=='toll-review']
          if len(preferred)!=1: raise ValueError('Missing or ambiguous original toll evidence')
          root=preferred[0].parent
          subprocess.run(['python3','tools/verify-toll-android-proof.py',str(root)],check=True)
          subprocess.run(['python3','tools/emit-native-replay-previews.py',str(root),'no-recordings'],check=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('directory='+str(root)+'\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-a5-toll-visual-review
          path: ${{ steps.review.outputs.directory }}
          if-no-files-found: error

  national-toll-source-audit:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[national-toll-source-audit]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect published national tariffs and public official map metadata
        run: |
          python3 -m pip install 'pypdf==6.1.3' 'certifi==2025.10.5' 'PyMuPDF==1.26.5'
          python3 - <<'PYCODE' 
          import concurrent.futures,hashlib,html,json,re,urllib.request,urllib.parse,subprocess,ssl,certifi,io
          from pypdf import PdfReader
          from html.parser import HTMLParser
          from pathlib import Path
          root=Path('national-toll-audit');root.mkdir()
          sources={
            'imt':'https://www.imt-ip.pt/rodoviario/infraestruturas-rodoviarias/rede-rodoviaria/taxas-de-portagem/',
            'ip':'https://servicos.infraestruturasdeportugal.pt/portagens-ips',
            'ascendi-electronic':'https://www.ascendi.pt/portagens-eletronicas/',
            'ascendi-traditional':'https://www.ascendi.pt/portagens-tradicionais/',
            'ascendi-map':'https://www.ascendi.pt/mapa/',
            'ascendi-root':'https://www.ascendi.pt/',
            'ascendi-no-www':'https://ascendi.pt/portagens-tradicionais/',
            'atlantico-pdf':'https://www.aeatlantico.pt/wp-content/uploads/2025/12/Taxas-20260101_Site.pdf',
            'ip-electronic-attributes':'https://utility.arcgis.com/usrsvcs/servers/98e22e48f7f84361b6428537ce9b017b/rest/services/webapps/pttolls/MapServer/0/query?f=json&where=1%3D1&outFields=*&returnGeometry=false',
            'ip-traditional-attributes':'https://utility.arcgis.com/usrsvcs/servers/98e22e48f7f84361b6428537ce9b017b/rest/services/webapps/pttolls/MapServer/4/query?f=json&where=1%3D1&outFields=*&returnGeometry=false',
            'ip-free-attributes':'https://utility.arcgis.com/usrsvcs/servers/98e22e48f7f84361b6428537ce9b017b/rest/services/webapps/pttolls/MapServer/6/query?f=json&where=1%3D1&outFields=*&returnGeometry=false',
            'ip-map-service':'https://utility.arcgis.com/usrsvcs/servers/98e22e48f7f84361b6428537ce9b017b/rest/services/webapps/pttolls/MapServer?f=json',
            'ip-map-item':'https://www.arcgis.com/sharing/rest/content/items/98e22e48f7f84361b6428537ce9b017b?f=json',
            'brisa':'https://www.brisaconcessao.pt/clientes/portagens/taxas-de-portagem',
            'brisa-august-pdf':'https://www.brisaconcessao.pt/Portals/0/Documentos/TabelaEcadaTaxas_23iva_25082026_v7.pdf',
            'pttolls-pdf':'https://www.pttolls.com/sites/default/files/2026-02/Mapas_Geral_2026_1.pdf',
            'ip-regulation-pdf':'https://servicos.infraestruturasdeportugal.pt/sites/default/files/2025-03/Regulamento%20do%20Setor%20IP.pdf',
            'atlantico':'https://www.aeatlantico.pt/pt/clientes/downloads/',
            'vialivre':'https://www.vialivre.pt/pt-pt/portagens/',
            'pttolls':'https://www.pttolls.com/',
            'lusoponte':'https://www.lusoponte.pt/',
            'ip-arcgis-app':'https://www.arcgis.com/sharing/rest/content/items/b2fe6aea0090417a9eb5a35799baae8e/data?f=json',
            'ip-arcgis-webmap':'https://www.arcgis.com/sharing/rest/content/items/ae05bf33e2984256b36869f6ca0366d1/data?f=json',
            'ip-arcgis-current':'https://www.arcgis.com/sharing/rest/content/items/5832f1981abe4dbd95f19d5c867123e6/data?f=json',
            'ip-arcgis-metadata':'https://www.arcgis.com/sharing/rest/content/items/5832f1981abe4dbd95f19d5c867123e6?f=json'}
          class Page(HTMLParser):
            def __init__(self):super().__init__();self.links=[];self.rows=[];self.row=None;self.cell=None;self.scripts=[]
            def handle_starttag(self,t,attrs):
              attrs=dict(attrs)
              if t=='a' and 'href' in attrs:self.links.append(attrs['href'])
              if t=='script' and 'src' in attrs:self.scripts.append(attrs['src'])
              if t=='tr':self.row=[]
              if t in ('td','th') and self.row is not None:self.cell=[]
            def handle_data(self,d):
              if self.cell is not None:self.cell.append(d)
            def handle_endtag(self,t):
              if t in ('td','th') and self.cell is not None:
                self.row.append(' '.join(' '.join(self.cell).split()));self.cell=None
              if t=='tr' and self.row is not None:
                if self.row:self.rows.append(self.row)
                self.row=None
          def get(entry):
            name,url=entry
            try:
              request=urllib.request.Request(url,headers={'User-Agent':'Atlas-Official-Toll-Audit/1.0'})
              context=ssl.create_default_context(cafile=certifi.where())
              issuers={'www.ascendi.pt':'EV','www.aeatlantico.pt':'DV','www.lusoponte.pt':'OV','ascendi.pt':'EV'}
              host=urllib.parse.urlparse(url).hostname
              if host in issuers:
                issuer='http://crt.sectigo.com/SectigoPublicServerAuthenticationCA'+issuers[host]+'R36.crt'
                with urllib.request.urlopen(issuer,timeout=30) as ca_response:der=ca_response.read(65536)
                pem=subprocess.run(['openssl','x509','-inform','DER','-outform','PEM'],input=der,capture_output=True,check=True).stdout
                ca=root/(host+'.ca.pem');ca.write_bytes(pem)
                subprocess.run(['openssl','verify','-CAfile',certifi.where(),str(ca)],check=True,capture_output=True)
                context.load_verify_locations(cadata=pem.decode())
                print('NATIONAL_TOLL_TLS_CHAIN_VERIFIED='+json.dumps({'host':host,'issuer':issuer,'sha256':hashlib.sha256(der).hexdigest()}),flush=True)
              with urllib.request.urlopen(request,context=context,timeout=45) as response:data=response.read(8*1024*1024+1);final=response.geturl()
              if len(data)>8*1024*1024:raise ValueError('Source too large')
              if data.startswith(b'%PDF'):
                pdf=root/(name+'.pdf');pdf.write_bytes(data)
                text='\f'.join(page.extract_text(extraction_mode='layout') for page in PdfReader(io.BytesIO(data)).pages)
                (root/(name+'.txt')).write_text(text)
                if name=='brisa-august-pdf':
                  import pymupdf,base64,textwrap
                  document=pymupdf.open(stream=data,filetype='pdf')
                  for page_number in [0,12]:
                    page=document[page_number]
                    image=page.get_pixmap(matrix=pymupdf.Matrix(1.7,1.7)).tobytes('jpeg',jpg_quality=80)
                    print('NATIONAL_TOLL_PREVIEW_BEGIN '+name+'-'+str(page_number+1),flush=True)
                    for encoded in textwrap.wrap(base64.b64encode(image).decode(),16000): print(encoded,flush=True)
                    print('NATIONAL_TOLL_PREVIEW_END '+name+'-'+str(page_number+1),flush=True)
                    spans=[{'text':span['text'],'bbox':span['bbox'],'dir':line['dir']} for block in page.get_text('dict')['blocks'] if 'lines' in block for line in block['lines'] for span in line['spans']]
                    print('NATIONAL_TOLL_PDF_SPANS='+json.dumps({'page':page_number+1,'spans':spans}),flush=True)
                print('NATIONAL_TOLL_PDF='+json.dumps({'name':name,'url':url,'sha256':hashlib.sha256(data).hexdigest(),'textLength':len(text)}),flush=True)
                return name,True
              text=data.decode('utf-8','replace');(root/(name+'.txt')).write_text(text)
              report={'name':name,'url':url,'finalUrl':final,'sha256':hashlib.sha256(data).hexdigest()}
              if text.lstrip().startswith('{'):
                report['json']=json.loads(text)
              else:
                page=Page();page.feed(text)
                report['links']=sorted(set(urllib.parse.urljoin(final,x) for x in page.links if re.search(r'2026|\.pdf|\.xls|tarif|taxas|portag|mapa',x,re.I)))
                report['scripts']=[urllib.parse.urljoin(final,x).split('?')[0] for x in page.scripts]
                report['dataLinks']=sorted(set(urllib.parse.urljoin(final,x) for x in page.links if 'arcgis' in x or 'download' in x or '.csv' in x))
                report['inlineDataHints']=[text[max(0,m.start()-100):m.end()+250] for m in re.finditer('pontos_cobranca|pontosCobranca|taxas|portico|pórtico|drupalSettings',text,re.I)][-30:]
                report['rows']=page.rows
                if name=='ascendi-root':
                  report['allLinks']=page.links
                  report['bodyText']=re.sub('<[^>]+>',' ',text)
              (root/(name+'.json')).write_text(json.dumps(report,ensure_ascii=False,indent=2))
              print('NATIONAL_TOLL_SOURCE='+json.dumps(report,ensure_ascii=False),flush=True)
              return name,True
            except Exception as error:
              if 'CERTIFICATE_VERIFY_FAILED' in str(error):
                host=urllib.parse.urlparse(url).hostname
                result=subprocess.run(['openssl','s_client','-connect',host+':443','-servername',host,'-showcerts'],input='',text=True,capture_output=True,timeout=30)
                match=re.search('-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----',result.stdout,re.S)
                if match:
                  info=subprocess.run(['openssl','x509','-noout','-issuer','-subject','-ext','authorityInfoAccess'],input=match.group(),text=True,capture_output=True,check=True)
                  print('NATIONAL_TOLL_TLS_DIAGNOSTIC='+json.dumps({'host':host,'certificateInfo':info.stdout}),flush=True)
              print('NATIONAL_TOLL_SOURCE_ERROR='+json.dumps({'name':name,'url':url,'error':str(error),'failedUrl':getattr(error,'url',None)}),flush=True);return name,False
          results=dict(concurrent.futures.ThreadPoolExecutor(max_workers=6).map(get,sources.items()))
          (root/'results.json').write_text(json.dumps(results,indent=2))
          if not results['imt'] or not results['ip']:raise ValueError('Required official national sources unavailable')
          PYCODE
      - name: Validate original PDF origin/destination cells
        run: |
          python3 tools/import-brisa-fares.py national-toll-audit/brisa-august-pdf.pdf --out national-toll-audit/Portugal-fares.csv
          cmp docs/data/toll-candidates/Portugal.csv national-toll-audit/Portugal-fares.csv
          cmp docs/data/toll-candidates/Portugal.audit.json national-toll-audit/Portugal-fares.audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Atlas-national-toll-source-audit
          path: national-toll-audit/
          if-no-files-found: error

  national-toll-geometry-census:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[national-toll-geometry-census]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Inspect original national charge-point identities and directed ways
        run: |
          python3 -m pip install 'osmium==4.1.1'
          python3 - <<'PYCODE'
          import hashlib,json,re,urllib.request,osmium
          from pathlib import Path
          root=Path('national-toll-geometry');root.mkdir()
          url='https://download.geofabrik.de/europe/portugal-latest.osm.pbf'
          with urllib.request.urlopen(url+'.md5',timeout=30) as response: expected=response.read(4096).decode().split()[0]
          if not re.fullmatch('[0-9a-f]{32}',expected): raise ValueError('Invalid source checksum')
          path=Path('/tmp/portugal-national-tolls.osm.pbf')
          with urllib.request.urlopen(url,timeout=120) as source,path.open('wb') as target:
            size=0
            while chunk:=source.read(1024*1024):
              size+=len(chunk)
              if size>1500*1024*1024: raise ValueError('Source too large')
              target.write(chunk)
          with path.open('rb') as stream:
            if hashlib.file_digest(stream,'md5').hexdigest()!=expected:raise ValueError('Source checksum mismatch')
          class Census(osmium.SimpleHandler):
            def __init__(self):super().__init__();self.points={};self.ways=[]
            def node(self,n):
              if n.tags.get('barrier')!='toll_booth' and n.tags.get('highway')!='toll_gantry':return
              if not n.location.valid() or not(36<=n.location.lat<=43 and -10<=n.location.lon<=-6):return
              self.points[n.id]={'id':n.id,'lat':n.location.lat,'lon':n.location.lon,'tags':dict(n.tags)}
            def way(self,w):
              nodes=[n.ref for n in w.nodes]
              if any(n in self.points for n in nodes):self.ways.append({'id':w.id,'nodes':nodes,'tags':dict(w.tags)})
          census=Census();census.apply_file(str(path),locations=False)
          wanted={n for w in census.ways for n in w['nodes']}
          class Coordinates(osmium.SimpleHandler):
            def __init__(self):super().__init__();self.values={}
            def node(self,n):
              if n.id in wanted and n.location.valid():self.values[str(n.id)]=[n.location.lat,n.location.lon]
          coordinates=Coordinates();coordinates.apply_file(str(path),locations=False)
          if len(coordinates.values)!=len(wanted):raise ValueError('Incomplete source coordinates')
          with path.open('rb') as stream:sha=hashlib.file_digest(stream,'sha256').hexdigest()
          data={'source':url,'sourceSha256':sha,'attribution':'OpenStreetMap contributors, ODbL; Geofabrik extract',
            'status':'unreviewed national candidates; no automatic exact-price certification',
            'points':list(census.points.values()),'ways':census.ways,'coordinates':coordinates.values}
          (root/'national-charge-points.json').write_text(json.dumps(data,ensure_ascii=False,indent=2))
          print('NATIONAL_CHARGE_CENSUS='+json.dumps({k:v for k,v in data.items() if k!='coordinates'},ensure_ascii=False))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Atlas-national-toll-geometry-census
          path: national-toll-geometry/
          if-no-files-found: error
