            if gh release view "$tag" >/dev/null 2>&1; then
              echo "::error::Release tag exists after a failed upload; manual inspection required."
              exit 1
            fi
            if (( attempt < 3 )); then sleep $(( attempt * 10 )); fi
          done
          if [[ "$published" != true ]]; then
            echo "::error::GitHub Releases denied publication (HTTP 403). The validated, signed APK is preserved as the Atlas-native-signed-release-apk workflow artifact. If this is an integration-permission restriction, configure ATLAS_RELEASE_PUBLISH_TOKEN (fine-grained Contents: write) in repository Actions secrets."
            exit 1
          fi
          echo "APK: https://github.com/$GH_REPO/releases/download/$tag/Atlas-v$RELEASE_VERSION.apk" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: |
          if [[ -n "${ATLAS_ANDROID_KEYSTORE_PATH:-}" && -f "$ATLAS_ANDROID_KEYSTORE_PATH" ]]; then
            rm -f "$ATLAS_ANDROID_KEYSTORE_PATH"
          fi
