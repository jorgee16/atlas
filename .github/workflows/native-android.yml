        with:
          name: Atlas-native-release-validation
          if-no-files-found: ignore
          path: |
            dist/android-validated/release-manifest.json
            dist/android-validated/*.sha256
            dist/android-validated/upgrade-report.txt
            android/native-app/build/reports/lint-results-release.*


  publish-validated:
    # Publishing is explicit. A normal push never tries to access signing secrets.
    # Signed Releases require core, focused Android smoke, and the full replay.
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-validated:40125928009]') && github.ref == 'refs/heads/migration/native-core-kotlin' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      ATLAS_ANDROID_KEYSTORE_BASE64: ${{ secrets.ATLAS_ANDROID_KEYSTORE_BASE64 }}
      ATLAS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ATLAS_ANDROID_KEYSTORE_PASSWORD }}
      ATLAS_ANDROID_KEY_PASSWORD: ${{ secrets.ATLAS_ANDROID_KEY_PASSWORD }}
      ATLAS_ANDROID_KEY_ALIAS: ${{ secrets.ATLAS_ANDROID_KEY_ALIAS }}
      ATLAS_ANDROID_CERT_SHA256: ${{ vars.ATLAS_ANDROID_CERT_SHA256 }}
      RELEASE_VERSION: '0.2.14'
      RELEASE_CODE: '17'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm source is EXACTLY successful CI #254, no app changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          validated=691c60a1f6f4fc3ff4d83706a316fe8f3fe682a1
          result="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/40125928009" --jq '.conclusion + " " + .head_sha')"
          [[ "$result" == "success $validated" ]] || { echo '::error::Validated CI was not successful for exact source'; exit 1; }
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/40125928009/jobs?per_page=100" --jq '[.jobs[] | select(.name == "core" or .name == "android") | select(.conclusion == "success")] | length')"
          [[ "$jobs" == 2 ]] || { echo '::error::Native and Android gates must both pass'; exit 1; }
          git merge-base --is-ancestor "$validated" "$GITHUB_SHA"
          invalid="$(git diff --name-only "$validated" "$GITHUB_SHA" | grep -Ev '^(.github/workflows/native-android.yml|tools/atlas-release-version.json|tools/atlas-validated-release.json)$' || true)"
          [[ -z "$invalid" ]] || { echo "::error::App source changed after green CI: $invalid"; exit 1; }
          [[ "$(python3 -c 'import json; x=json.load(open("tools/atlas-release-version.json")); print(x["versionName"],x["versionCode"])')" == '0.2.14 17' ]]
          echo "VALIDATED_SHA=$validated" >> "$GITHUB_ENV"
          git checkout --detach "$validated"
          echo 'Validated #254 passed, checked out exactly tested source, no tests are repeated.'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
