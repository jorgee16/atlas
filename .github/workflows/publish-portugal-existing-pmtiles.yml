name: Publish already-generated Portugal PMTiles

on:
  workflow_dispatch:
  push:
    branches: [migration/native-core-kotlin]
    paths:
      - '.github/workflows/publish-portugal-existing-pmtiles.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: portugal-pmtiles-publish
  cancel-in-progress: false

jobs:
  publish-existing:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: atlas-regions
      RCLONE_CONFIG_ATLASR2_TYPE: s3
      RCLONE_CONFIG_ATLASR2_PROVIDER: Cloudflare
      RCLONE_CONFIG_ATLASR2_NO_CHECK_BUCKET: 'true'
      RCLONE_CONFIG_ATLASR2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_ATLASR2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/native-core-kotlin
          persist-credentials: true

      - name: Validate Cloudflare R2 configuration before downloading
        shell: bash
        run: |
          set -euo pipefail
          for key in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error title=Missing R2 secret::$key is empty; check GitHub repository Actions secrets"
              exit 1
            fi
          done
          echo "RCLONE_CONFIG_ATLASR2_ENDPOINT=https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" >> "$GITHUB_ENV"

      - name: Retrieve previously validated Portugal PMTiles artifact
        uses: actions/download-artifact@v4
        with:
          name: Atlas-portugal-vector-pmtiles
          run-id: 38975091297
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: work/output

      - name: Verify original PMTiles size and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c%s work/output/map.pmtiles)" -eq 343766325
          printf '%s  %s\n' \
            ba79df72201d0ad97bc1f2abbfc0470c02ee23f88c80d658166af428ca0127b4 \
            work/output/map.pmtiles | sha256sum --check
          python3 - <<'PY'
          from pathlib import Path
          with Path('work/output/map.pmtiles').open('rb') as f:
              assert f.read(8) == b'PMTiles' + bytes([3])
          print('Verified PMTiles v3 header.')
          PY

      - name: Install current rclone 1.75.2 with pinned checksum
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/rclone/rclone/releases/download/v1.75.2/rclone-v1.75.2-linux-amd64.zip \
            --output work/rclone-v1.75.2.zip
          echo '349ac8fba6ff65d6247043f1750cdcb518ec5d500ef91463a10d37c0ccdf3702  work/rclone-v1.75.2.zip' | sha256sum --check
          unzip -q work/rclone-v1.75.2.zip -d work/rclone-bin
          sudo install -m 0755 work/rclone-bin/rclone-v1.75.2-linux-amd64/rclone /usr/local/bin/rclone
          rclone version | head -1

      - name: Verify object writes without bucket-create calls
        shell: bash
        run: |
          set -euo pipefail
          printf 'atlas-r2-write-check-%s\\n' "$GITHUB_RUN_ID" > work/r2-write-probe.txt
          key="region-packages/portugal/.atlas-r2-write-check-${GITHUB_RUN_ID}"
          rclone copyto work/r2-write-probe.txt atlasr2:"$R2_BUCKET"/"$key" --s3-no-check-bucket --retries 1
          rclone deletefile atlasr2:"$R2_BUCKET"/"$key" --s3-no-check-bucket
          echo 'R2 object write and delete successfully verified.'

      - name: Verify R2 catalog and prevent accidental overwrite
        shell: bash
        run: |
          set -euo pipefail
          rclone cat atlasr2:"$R2_BUCKET"/regions/catalog.json > work/live-catalog.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const live=JSON.parse(fs.readFileSync('work/live-catalog.json','utf8'));
          const local=JSON.parse(fs.readFileSync('public/regions/catalog.json','utf8'));
          const pt=live.regions.find(r=>r.id==='portugal');
          const baseline=local.regions.find(r=>r.id==='portugal');
          if (pt?.version!==8 || baseline?.version!==8 || pt?.assets?.map) {
            throw new Error('Unexpected Portugal catalog version or an already-declared R2 map');
          }
          // Preserve the authoritative remote record, including fields absent
          // from the bundled catalog.
          if (JSON.stringify(pt)!==JSON.stringify(baseline)) {
            console.log('Remote Portugal metadata differs from GitHub; retaining remote version.');
            console.log('Remote asset keys:',Object.keys(pt.assets??{}).join(','));
            console.log('Remote package bytes:',pt.sizeBytes);
          }
          console.log('Portugal v8 verified; retaining authoritative remote metadata.');
          JS

      - name: Upload map to Portugal region package without changing routing
        shell: bash
        run: |
          set -euo pipefail
          rclone copyto work/output/map.pmtiles \
            atlasr2:"$R2_BUCKET"/region-packages/portugal/map.pmtiles \
            --s3-chunk-size 32M --s3-upload-concurrency 2 \
            --s3-no-check-bucket --retries 4 --stats 30s
          remote_bytes="$(rclone lsl atlasr2:"$R2_BUCKET"/region-packages/portugal/map.pmtiles | awk '{print $1}')"
          test "$remote_bytes" = "343766325"
          curl -fsSI --retry 3 --max-time 30 \
            'https://pub-75539028275a4826aa383fdb89292ed7.r2.dev/region-packages/portugal/map.pmtiles'
          echo 'Map uploaded to R2, confirmed full size and public HTTP 200.'

      - name: Build Portugal v9 catalog preserving other regions
        run: |
          node tools/region-builder/publish-portugal-map.mjs \
            --map work/output/map.pmtiles \
            --source work/live-catalog.json \
            --output work/new-catalog.json

      - name: Commit v9 to website and Android app catalogs
        shell: bash
        run: |
          set -euo pipefail
          cp work/new-catalog.json public/regions/catalog.json
          cp work/new-catalog.json android/native-app/src/main/assets/regions.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/regions/catalog.json android/native-app/src/main/assets/regions.json
          git commit -m "Register published Portugal PMTiles v9"
          git push origin HEAD:migration/native-core-kotlin

      - name: Publish R2 catalog last and verify v9
        shell: bash
        run: |
          set -euo pipefail
          rclone copyto work/new-catalog.json atlasr2:"$R2_BUCKET"/regions/catalog.json --s3-no-check-bucket --retries 4
          rclone cat atlasr2:"$R2_BUCKET"/regions/catalog.json > work/confirmed-catalog.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const saved=JSON.parse(fs.readFileSync('work/confirmed-catalog.json','utf8'));
          const pt=saved.regions.find(r=>r.id==='portugal');
          if(pt?.version!==9 ||
             pt?.assets?.map!=='/region-packages/portugal/map.pmtiles' ||
             !pt.package.files.some(x=>x.group==='map'&&x.sizeBytes===343766325)) {
            throw new Error('Portugal map missing from published v9 catalog');
          }
          console.log('Portugal v9 R2 catalog confirmed.');
          JS
          {
            echo '## Portugal offline PMTiles — published'
            echo
            echo '- 343766325-byte vector PMTiles verified by SHA-256.'
            echo '- Map: region-packages/portugal/map.pmtiles'
            echo '- Catalog: regions/catalog.json (Portugal v9)'
            echo '- Existing routing, POIs, and other region entries preserved.'
          } >> "$GITHUB_STEP_SUMMARY"
